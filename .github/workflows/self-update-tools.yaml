# This repo's own tool updater, dogfooding the reusable update-tools workflow by
# local path (so it always runs the current definition, not a release pin). The
# one repo-local tool is zizmor, floating on "latest" in the root mise.toml and
# pinned by the root mise.lock; the shared toolchain tools live in the .mise/
# submodule and are bumped upstream, never here.
#
# The bump commit is authored by the "FF Merge" App (org variable
# FF_MERGE_CLIENT_ID + org secret FF_MERGE_PRIVATE_KEY -- see
# bitwise-media-group/ff-merge, the same App as the /merge flow), so the update
# PR's CI runs on its own; the GITHUB_TOKEN fallback's recursion guard would
# suppress those checks.
name: Update Tools

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      cooldown-days:
        description: Minimum age (days) a release must have before it is adopted.
        required: false
        default: "7"

# one updater at a time; a fresh run supersedes a stale one
concurrency:
  group: update-tools
  cancel-in-progress: true

# ceiling for the reusable workflow's update job
permissions:
  # push the update branch
  contents: write
  # open/update the pull request
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/update-tools.yaml
    with:
      cooldown-days: ${{ github.event.inputs.cooldown-days || '7' }}
      # the App authors the bump commit, so the update PR's CI runs; without it
      # the GITHUB_TOKEN fallback's recursion guard would suppress the checks
      app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
