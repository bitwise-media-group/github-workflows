# Reusable Dependabot dist/ rebuild. A JavaScript/TypeScript Action ships its bundled
# output committed at dist/, which GitHub runs directly at consumption time with no build
# step -- so the reusable CI (ci.yaml) fails any PR whose committed dist/ does not
# reproduce from src/ (`mise run build` then `git diff --exit-code -- dist`). Dependabot
# bumps a bundled dependency but never runs the build task, so its PR lands with a stale
# dist/ and CI goes red -- and Dependabot auto-merge (dependabot-merge.yaml) waits for
# green, so the PR sticks.
#
# This workflow closes that gap. When a watched CI run for a `dependabot/` branch FAILS, it
# checks out the PR head, runs `mise run build`, and -- only if dist/ actually changed --
# commits the regenerated bundle back to the PR branch as the App, via the GraphQL
# createCommitOnBranch mutation rather than `git commit`/`git push`: commits created
# through that mutation are signed by GitHub and show as Verified, so the PR satisfies a
# required-signatures rule on EVERY merge path -- including the signature-preserving
# fast-forward `/merge` flow (merge.yaml), which moves the base ref to the PR head verbatim
# and would be rejected outright if this commit were unsigned. The push re-triggers CI (an
# App-token commit does, API-created or not; a GITHUB_TOKEN push would be suppressed by
# GitHub's own loop-prevention), and the rerun's dist/ now reproduces, so CI goes green.
#
# It deliberately does NOT approve or merge. The rebuild commit makes the PR head a
# non-Dependabot commit, so dependabot-merge.yaml's author+signature gate stops
# auto-approving -- a human reviews and approves the (production-dependency) bump, and the
# existing App squash-merge takes it from there. Dev-only bumps that don't touch dist/
# never fail CI, never reach this workflow, and keep auto-merging untouched.
#
# workflow_run -- not pull_request -- is the trigger, for the same reason dependabot-merge
# uses it: a Dependabot-triggered pull_request run gets a read-only GITHUB_TOKEN and only
# Dependabot secrets, so it could neither read the App key nor push a CI-retriggering
# commit. A workflow_run runs in the base-branch context with the repo's Actions secrets.
#
# SECURITY: rebuilding runs the PR's dependency tree (`npm ci` lifecycle scripts + the
# bundler). To keep the write-capable App token away from that untrusted code, the token is
# minted first but the checkout persists no credentials and no build step exposes it; the
# token appears only in the final commit step, after the build has already run.
# The blast radius is a Dependabot PR (a same-repo branch carrying dependency bumps), and
# the token is scoped to contents:write.
#
# Requires the same "FF Merge" App as dependabot-merge.yaml -- it already has
# contents:write and sits in main's ruleset bypass list. Runs via workflow_call from a thin
# caller (examples/dependabot-dist.yaml) that triggers on the CI workflow's completion.
name: Reusable Dependabot Dist Rebuild

on:
  workflow_call:
    inputs:
      app-client-id:
        description: The client id of the github app used to push the rebuilt dist (vars.FF_MERGE_CLIENT_ID)
        required: true
        type: string
      node-version-file:
        description: File the Node version is read from (passed to setup-node).
        required: false
        default: .node-version
        type: string
      paths:
        description: >-
          Space-separated build-output path(s) to rebuild and commit. Defaults to the
          node-action archetype's `dist`. Only changes under these paths are committed, so
          an unrelated CI failure that leaves them untouched is a no-op.
        required: false
        default: dist
        type: string
    secrets:
      app-private-key:
        description: The private key for the github app used to push the rebuilt dist (secrets.FF_MERGE_PRIVATE_KEY)
        required: true

# the App token does all privileged work; the job GITHUB_TOKEN needs nothing
permissions: {}

jobs:
  rebuild:
    # Only when a CI run for a Dependabot branch FAILED: a green run already has a
    # reproducing dist/, so there is nothing to rebuild. Restrict to a same-repo
    # dependabot/ head (never a fork) so the build never runs untrusted fork code with the
    # App token in reach. Runs on `main` (push) never match the branch filter.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Serialize rebuilds for one branch so two CI failures cannot race on the push.
    concurrency:
      group: dependabot-dist-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false

    steps:
      - name: Mint a github app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          # Pushes the rebuilt bundle to the PR branch and nothing else. The commit touches
          # dist/ only (never .github/workflows/), so no workflows scope is needed.
          permission-contents: write

      - name: Checkout the Dependabot PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          # fetch the shared task library (bitwise-media-group/make), mounted at .mise/
          submodules: true
          # Fetch with the App token but do NOT persist it: the build below runs the PR's
          # dependency tree, which must never see the write token. The commit step supplies
          # the token to the API call explicitly, after the build has run.
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mise is the task runner: the rebuild below is `mise run build`, with the
      # bundler tools pinned and verified against the library's mise.lock.
      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: v2026.8.9
          # sha256 of the linux-x64 mise binary for the version above, from the release's
          # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
          sha256: 997b6f3e0d760d292eb99f2824c70dddb432514b3a0d487f975c0f22b3cae430

      - name: Rebuild the bundle
        run: mise run build

      - name: Commit and push the rebuilt bundle if it changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail

          # Split the space-separated paths input into an array for git.
          read -ra dist_paths <<< "$PATHS"

          # Nothing to do if the rebuild left the committed bundle unchanged -- e.g. the CI
          # failure was unrelated to dist/, or a prior rerun already fixed it.
          if [ -z "$(git status --porcelain -- "${dist_paths[@]}")" ]; then
            echo "dist/ already reproduces from src/; nothing to rebuild."
            exit 0
          fi

          # The commit is created server-side with the GraphQL createCommitOnBranch
          # mutation -- not `git commit`/`git push` -- because GitHub signs mutation-created
          # commits (Verified, attributed to the App bot). A locally-created commit would be
          # unsigned: the base branch's required-signatures rule would then reject the
          # signature-preserving fast-forward `/merge` flow, which moves the base ref to the
          # PR head verbatim (the squash path re-signs anyway, but /merge does not).
          #
          # Build the mutation's fileChanges from the working tree: files that still exist
          # are additions (contents base64-encoded, as the API requires -- binary files
          # included), files the rebuild removed are deletions. `-z` NUL-delimits entries so
          # unusual filenames survive; renames never appear for unstaged changes, so every
          # entry is `XY <path>`. Contents are streamed through files, never argv -- a
          # bundled dist easily exceeds the kernel's per-argument size limit.
          tmp=$(mktemp -d)
          printf '[]' > "${tmp}/additions.json"
          printf '[]' > "${tmp}/deletions.json"
          while IFS= read -r -d '' entry; do
            path=${entry:3}
            if [ -e "$path" ]; then
              base64 -w0 < "$path" > "${tmp}/contents.b64"
              jq --arg p "$path" --rawfile c "${tmp}/contents.b64" \
                '. + [{path: $p, contents: $c}]' \
                "${tmp}/additions.json" > "${tmp}/additions.json.new"
              mv "${tmp}/additions.json.new" "${tmp}/additions.json"
            else
              jq --arg p "$path" '. + [{path: $p}]' \
                "${tmp}/deletions.json" > "${tmp}/deletions.json.new"
              mv "${tmp}/deletions.json.new" "${tmp}/deletions.json"
            fi
          done < <(git status --porcelain -z -- "${dist_paths[@]}")

          # expectedHeadOid makes the mutation a compare-and-swap: if the branch moved since
          # checkout (a Dependabot rebase, say), GitHub refuses instead of clobbering it --
          # the new head's own CI run re-enters this workflow. The whole request body is
          # assembled with jq and sent via --input so the (multi-megabyte, base64) contents
          # never hit a command line. The App token is supplied only here (GH_TOKEN), never
          # during the build.
          # shellcheck disable=SC2016 # $input is a GraphQL variable, not shell
          query='mutation ($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid } }
          }'
          jq -n \
            --arg query "$query" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --slurpfile additions "${tmp}/additions.json" \
            --slurpfile deletions "${tmp}/deletions.json" \
            '{query: $query, variables: {input: {
               branch: {repositoryNameWithOwner: $repo, branchName: $branch},
               expectedHeadOid: $head,
               message: {headline: ("build(deps): rebuild dist for " + $branch)},
               fileChanges: {additions: $additions[0], deletions: $deletions[0]}
             }}}' > "${tmp}/body.json"
          oid=$(gh api graphql --input "${tmp}/body.json" \
            --jq '.data.createCommitOnBranch.commit.oid')
          echo "Pushed rebuilt dist/ to ${BRANCH} as signed commit ${oid}; CI will re-run and go green."
