# Reusable release pipeline for any repo. Release-please watches main and keeps a
# release PR current from the Conventional Commit history; when that PR merges it
# cuts the GitHub release and vX.Y.Z tag. What happens next depends on the repo:
#
#   - A release that has a build step takes the `publish` job: the cut release
#     is a draft (release-please `draft: true` -- "something fills this release
#     before it is published") or the repo has a .goreleaser.yaml. The job runs
#     the repo's `release` mise task as `mise run release --draft`, whatever
#     tool that task drives: the go and swift toolchain archetypes run
#     GoReleaser (archives + checksums + SBOMs + keyless cosign signatures,
#     Developer ID-signed + notarized darwin binaries via goreleaser
#     `notarize.macos` when the caller passes the `macos-*` secrets, an
#     optional Homebrew cask, container images via dockers_v2); other
#     archetypes may build with GoReleaser and then push to a package registry
#     (npm, PyPI). The contract for every task: fill the draft, never publish
#     it, and write a sha256sum-format dist/checksums.txt for the files that
#     should get a GitHub build-provenance attestation (plus dist/digests.txt
#     for container images). The job publishes the release as its very last
#     step, once every asset, the cask, and the attestations have landed.
#     Releases are immutable once published, so anything that can fail must
#     fail while the release is still a draft that can be retried. Registry
#     uploads (npm, PyPI) are immutable too, so a task that pushes to one does
#     it LAST inside the task, after everything else that can fail.
#   - A repo with a zensical.toml takes the `docs` job: its `docs-build` mise
#     task rebuilds the Zensical site and the job publishes it to GitHub Pages.
#     This is keyed off config-presence detection and is independent of the
#     publish path, so a repo can ship binaries AND publish docs from one
#     release. By default the site is published only when a release is cut; a
#     caller that sets always-publish-docs: true publishes it on every push to
#     the default branch instead (the examples/ caller reads that from the
#     ALWAYS_PUBLISH_DOCS repository variable). Callers must grant `pages: write`
#     for it (see the permissions note below); the consuming repo must also set
#     Settings -> Pages -> GitHub Actions.
#   - Every other repo's release is just the release-please cut. A committed dist/
#     is verified for freshness in CI (reusable ci.yaml), not here.
#
# A final vanity-tags job, when the caller sets vanity-tags: true, moves the
# floating major and minor tags (v1 and v1.1) that consumers pin -- it needs the
# publish job, so on the publish path the tags advance only after that job has
# published the release, and on every other path (publish skipped) it runs
# straight after release-please.
#
# Detection lives in outputs of the release-please job (config hashes plus the
# cut release's draft flag), because a job-level `if:` runs before checkout and
# can't see the workspace. The two-pass release-please + idempotent tag
# creation works for both draft (publish path) and non-draft releases.
#
# Callers can gate follow-on work (docs publish, deploys, notifications) on the
# workflow_call outputs below: release_created is truthy only when this run cut a
# release, alongside the tag_name/sha/version/major/minor/patch it produced (all
# empty otherwise). This lets a caller append a release-only job (a deploy, an
# announcement) that must not run on every push to main.
#
# The consuming repo provides release-please-config.json + .release-please-manifest.json.
# Repos that ship build artifacts set draft: true in release-please-config.json and
# have a `release` mise task (Go repos also add a .goreleaser.yaml, release-type: go);
# Actions repos that commit dist/ set vanity-tags: true so their @v1/@v1.1 consumers
# track each release.
# Repos that publish docs add a zensical.toml plus pyproject.toml + uv.lock at the
# repo root (the docs job runs `mise run docs-build`). Both jobs run mise tasks, so
# a repo customises its release or docs build by overriding `release` /
# `docs-build` in its mise config rather than this workflow.
#
# Runs via workflow_call from a thin caller (examples/release.yaml) that owns the
# push trigger and grants the release permissions.
name: Reusable Release

on:
  workflow_call:
    inputs:
      vanity-tags:
        description: >-
          Move the floating major and minor tags (v1 and v1.1) to the release commit, for any release type. Off by
          default; set true for Actions/reusable repos whose consumers pin @v1.
        required: false
        default: false
        type: boolean
      always-publish-docs:
        description: >-
          Publish the Zensical docs site (a repo with a zensical.toml) on every push to the default branch, not only
          when a release is cut. Off by default, so the site always describes the latest release; set true for a repo
          whose docs should track main. The examples/ caller reads it from the ALWAYS_PUBLISH_DOCS repository variable.
        required: false
        default: false
        type: boolean
      app-client-id:
        description: >-
          Optional client id of a GitHub App used to author the release (e.g. vars.FF_MERGE_CLIENT_ID). When set (with
          app-private-key) release-please authenticates as the App instead of the default GITHUB_TOKEN, so the release
          PR's branch push is attributed to the App. Set this when workflow_run-keyed automation must fire for the
          release PR: a push made with the default GITHUB_TOKEN does NOT emit workflow_run events (GitHub's
          recursion guard), so auto-merge keyed on workflow_run never retriggers when the release PR's checks go green.
          Falls back to GITHUB_TOKEN when unset.
        required: false
        default: ""
        type: string
      homebrew-tap:
        description: >-
          Name of the Homebrew tap repository, in the caller's own organisation, that .goreleaser.yaml pushes its
          cask to. When the config declares homebrew_casks, the publish job mints a short-lived token from the App
          named by app-client-id (required in that case) scoped to contents + pull-requests write on this one
          repository, so the App must be installed on it. Only used when .goreleaser.yaml publishes a cask.
        required: false
        default: homebrew-tap
        type: string
      runs-on:
        description: >-
          Runner label for every job: release-please, publish, docs and vanity-tags. Default ubuntu-latest.
          Linux arm64 and macOS hosted runners (macos-latest, arm64) are supported wherever the repo's mise.lock has entries for the platform (the shared toolchain's covers
          linux-x64, linux-arm64 and macos-arm64); Intel macOS and Windows are not.
          Container images (a root Dockerfile) need a Linux runner; the publish job's disk clean-up runs on
          Linux only.
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      app-private-key:
        description: >-
          Private key for the App named by app-client-id (e.g. secrets.FF_MERGE_PRIVATE_KEY). Required when app-client-id
          is set; ignored otherwise.
        required: false
      # Apple signing + notarization material for a .goreleaser.yaml with a
      # `notarize.macos` block. All five are org secrets, scoped to the repos that
      # notarize (the org's one shared open-source Developer ID certificate and
      # one App Store Connect team API key); a repo whose config has no notarize
      # block leaves them out. Setup: README -> "macOS notarization: org setup".
      macos-sign-p12:
        description: >-
          Base64 of the .p12 (Developer ID Application certificate + private key) that signs the darwin binaries
          (secrets.MACOS_SIGN_P12, the org's shared open-source signing certificate). Optional; only read by a
          .goreleaser.yaml with a notarize.macos block. See README -> macOS notarization.
        required: false
      macos-sign-password:
        description: >-
          Export password of the .p12 in macos-sign-p12 (secrets.MACOS_SIGN_PASSWORD). Optional; only read by a
          .goreleaser.yaml with a notarize.macos block. See README -> macOS notarization.
        required: false
      macos-notary-issuer-id:
        description: >-
          Issuer ID of the App Store Connect team API key that submits the notarization
          (secrets.MACOS_NOTARY_ISSUER_ID). Optional; only read by a .goreleaser.yaml with a notarize.macos block. See
          README -> macOS notarization.
        required: false
      macos-notary-key-id:
        description: >-
          Key ID of that App Store Connect team API key (secrets.MACOS_NOTARY_KEY_ID). Optional; only read by a
          .goreleaser.yaml with a notarize.macos block. See README -> macOS notarization.
        required: false
      macos-notary-key:
        description: >-
          Base64 of that App Store Connect team API key's .p8 private key (secrets.MACOS_NOTARY_KEY). Optional; only
          read by a .goreleaser.yaml with a notarize.macos block. See README -> macOS notarization.
        required: false
    # Surface the release-please result so a caller can add release-only jobs.
    # Every value is an empty string when this run did not cut a release, so gate
    # with `if: needs.release.outputs.release_created` (where `release` is the
    # caller's job that `uses:` this workflow).
    #
    # Keep the `${{ }}` braces OUT of the descriptions below: GitHub evaluates
    # expressions inside a workflow_call output description, and `needs` is out of
    # scope there, so a braced example is an "invalid workflow file" at startup.
    # A job-level `if:` needs no braces anyway.
    outputs:
      release_created:
        description: >-
          "true" when this run cut a release (the release PR merged), empty string otherwise. Use as the gate for
          follow-on jobs: `if: needs.release.outputs.release_created`.
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Git tag of the release just cut (e.g. v1.2.3). Empty string when no release was created.
        value: ${{ jobs.release-please.outputs.tag_name }}
      sha:
        description: Commit SHA the release was tagged at. Empty string when no release was created.
        value: ${{ jobs.release-please.outputs.sha }}
      version:
        description: Full semver of the release, no leading v (e.g. 1.2.3). Empty string when no release was created.
        value: ${{ jobs.release-please.outputs.version }}
      major:
        description: Major component of the released version (e.g. 1). Empty string when no release was created.
        value: ${{ jobs.release-please.outputs.major }}
      minor:
        description: Minor component of the released version (e.g. 2). Empty string when no release was created.
        value: ${{ jobs.release-please.outputs.minor }}
      patch:
        description: Patch component of the released version (e.g. 3). Empty string when no release was created.
        value: ${{ jobs.release-please.outputs.patch }}

# Granted per job below. Note for callers: GitHub validates a reusable workflow's
# permissions as the union of every job and ignores `if:`, so a caller must grant
# the publish job's id-token/attestations/artifact-metadata/packages and the
# docs job's pages:write even on the paths where those jobs are skipped -- see
# examples/release.yaml.
permissions: {}

# concurrent release-please runs can open duplicate release PRs; queue them.
concurrency:
  group: release

jobs:
  release-please:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # create draft release and git tag
      contents: write
      # create pr labels via issues api
      issues: write
      # create the release pull request
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      sha: ${{ steps.release-please.outputs.sha }}
      version: ${{ steps.release-please.outputs.version }}
      major: ${{ steps.release-please.outputs.major }}
      minor: ${{ steps.release-please.outputs.minor }}
      patch: ${{ steps.release-please.outputs.patch }}
      # internal (not workflow_call outputs): truthy flags that gate the publish
      # and docs jobs. publish is the cut release's draft flag or, failing that,
      # the .goreleaser.yaml hash (repos that predate the draft signal).
      publish: ${{ steps.draft.outputs.draft || steps.detect.outputs.goreleaser }}
      zensical: ${{ steps.detect.outputs.zensical }}
    steps:
      # checked out so the config detection below can read the workspace; a
      # job-level `if:` on the downstream jobs runs before their checkout and
      # could not see it.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # release-please authenticates with the App token or GITHUB_TOKEN, not the persisted credential

      # When the caller supplies a GitHub App (app-client-id + app-private-key),
      # mint a short-lived installation token so release-please authors the release
      # as the App. This is what lets the release PR's branch push emit workflow_run
      # events: a push made with the default GITHUB_TOKEN is suppressed by GitHub's
      # recursion guard, so any workflow_run-keyed automation (e.g. the reusable
      # auto-merge) never fires when a GITHUB_TOKEN-authored release PR goes green.
      # Skipped when no App is configured: the output is empty and every step below
      # falls back to GITHUB_TOKEN (release PR still opens, just doesn't retrigger
      # workflow_run automation).
      - name: Mint a github app installation token
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          # release-please cuts the release/tag (contents) and opens the release PR
          # (pull-requests); the autorelease:* labels it applies already exist, so
          # pull-requests:write covers labelling and no issues scope is needed.
          permission-contents: write
          permission-pull-requests: write

      # Each output is a config-file hash (empty when the file is absent), used
      # downstream as a truthy flag: goreleaser (with the draft flag below) gates
      # the publish job; zensical gates the docs job. hashFiles returns a fixed-format hash, never
      # caller-controlled text, so interpolating it into the run script is injection-safe.
      - name: Detect goreleaser and zensical config
        id: detect
        run: |
          {
            echo "goreleaser=${{ hashFiles('.goreleaser.yaml', '.goreleaser.yml') }}"
            echo "zensical=${{ hashFiles('zensical.toml') }}"
          } >> "$GITHUB_OUTPUT"

      # First pass cuts the release only; the release PR is built in a second pass
      # below, once the tag exists.
      - name: Get release version
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          skip-github-pull-request: true

      # Guarantee the tag exists at the released commit: a draft release
      # (draft: true) has no tag yet and the release task (GoReleaser, say) cannot
      # version without one, so create it; a non-draft release already made it, so
      # the create fails and the patch sets it to the same commit (a no-op).
      # Idempotent either way.
      - name: Create release tag
        if: ${{ steps.release-please.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
          SHA: ${{ steps.release-please.outputs.sha }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" ||
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -X PATCH -f sha="$SHA" -F force=true

      # Is the release just cut a draft? release-please `draft: true` means
      # "something fills this release before it is published", which is the
      # signal for the publish job -- a `release` mise task alone is not, because
      # the go archetype defines one in every Go repo, libraries included. The
      # releases list is read rather than releases/tags/{tag}, because a draft
      # does not resolve by tag; a just-cut release is near the top of it.
      - name: Detect a draft release
        id: draft
        if: ${{ steps.release-please.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
        run: |
          set -eu
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.tag_name == env.TAG) | .draft] | first // false')"
          if [ "$draft" = "true" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      # Build the release PR only now that the tag exists. A draft release whose
      # tag ref is missing is invisible to release-please's latest-release lookup,
      # so computing the PR in the same pass that cuts a release treats every
      # released commit as unreleased and opens a duplicate vNext PR.
      - name: Create release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          skip-github-release: true

  publish:
    needs: release-please
    # Only run the privileged, full-history checkout of a computed ref from a
    # trusted trigger. This workflow is reusable, so CodeQL can't see the caller's
    # trigger and assumes a privileged fork-PR context; the guard makes the
    # trusted-context assumption explicit and enforced (defense in depth against a
    # consumer wiring this to pull_request_target). This is a positive allowlist,
    # not a denylist of fork-triggerable events: a new event type GitHub may add
    # later fails closed (the job is skipped) until it is vetted and added here.
    if: >-
      needs.release-please.outputs.release_created && needs.release-please.outputs.publish &&
      contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # upload assets and publish the draft release (and move vanity tags)
      contents: write
      # use id token for cosign keyless signing (and registry trusted publishing)
      id-token: write
      # write github provenance attestation
      attestations: write
      # create artifact storage record for github attestation
      artifact-metadata: write
      # push container images (a repo with a goreleaser dockers_v2 config) to ghcr
      packages: write
    steps:
      # Reclaim root-disk space before anything lands on it. A cold-cache build
      # of every target plus multi-platform buildx images under QEMU (no Go or
      # mise cache in this job, by design -- see Setup mise) can outgrow the
      # free space a hosted runner leaves on / -- an unchanged release config
      # that fit on ubuntu-24.04 died mid-build with "No space left on device"
      # once ubuntu-latest moved to ubuntu-26.04, taking the runner's own log
      # with it. Every tool this job runs comes from the repo's mise pins,
      # so the preinstalled SDKs below are dead weight here (swift is kept: the
      # swift archetype's release may build with it). Absent paths are no-ops,
      # so image drift can only make this do less. The removals run in parallel
      # (the android SDK alone takes minutes serially), and df brackets them so
      # a future disk failure shows the headroom it started with in the log.
      # The paths and the docker prune are the Ubuntu image's, so the step runs
      # only on a Linux runner (a macOS runs-on skips it).
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          set -eu
          df -h /
          for dir in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell; do
            sudo rm -rf "$dir" &
          done
          wait
          docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout repository at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # the release task (GoReleaser's changelog, say) may need full history + tags
          persist-credentials: false # the release task uploads via the GITHUB_TOKEN env, not the persisted credential
          submodules: true # fetch the shared task library (bitwise-media-group/make), mounted at .mise/, whose mise pins and tasks drive the release below; a no-op where the config is a root mise.toml

      # The whole release toolchain comes from the repo's mise pins -- the
      # language toolchain (Go, Swift, bun, uv, ...), goreleaser, cosign for the
      # keyless signing config, syft for the sboms config, and whatever else
      # the repo's `release` task calls -- so the release is built by exactly
      # the versions `mise run release` uses locally. A plain install fetches
      # the eager pins; the toolchain's lazy pins (goreleaser, cosign, syft, ...)
      # install on first use inside the task. Every download's sha256 (and
      # provenance, where published) is verified against mise.lock (`--locked`
      # is added automatically). Tools land outside the workspace, so nothing
      # trips GoReleaser's git-dirty check.
      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # an exact version, and no sha256 input: the action then verifies the
          # download for the runner's platform against the release's Sigstore-signed
          # packslip (bound to mise's release workflow at this tag), a check a
          # sha256 input would replace with a bare hash comparison
          version: v2026.11.10
          # no cache in the release-signing job (neither mise's tool cache nor a
          # Go build cache): a cache poisoned from a less-trusted context must
          # not feed the signed, attested artifacts
          cache: false

      # Container images (a repo with a dockers_v2 config in .goreleaser.yaml):
      # buildx with a docker-container driver for multi-platform manifests, QEMU
      # binfmt so non-native Dockerfile stages (apt/npm under arm64) can run on
      # the amd64 runner, and a ghcr login for the push. Gated on a repo-root
      # Dockerfile / Dockerfile.* — the same convention dockers_v2 configs here
      # follow — so image-less repos skip all three.
      - name: Setup QEMU
        if: ${{ hashFiles('Dockerfile', 'Dockerfile.*') != '' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup docker buildx
        if: ${{ hashFiles('Dockerfile', 'Dockerfile.*') != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr
        if: ${{ hashFiles('Dockerfile', 'Dockerfile.*') != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Does .goreleaser.yaml push a Homebrew cask? Gates the tap token below so
      # a repo without a cask never mints one. grep -q exits 0 on the first
      # match even when the other candidate file is missing, and non-zero when
      # neither file declares a cask. A cask can only be pushed with the App's
      # token, so fail here -- before anything is built, signed or uploaded --
      # when the caller declares one without an App or a tap.
      - name: Detect homebrew cask
        id: homebrew
        env:
          APP_CLIENT_ID: ${{ inputs.app-client-id }}
          TAP: ${{ inputs.homebrew-tap }}
        run: |
          if grep -Eqs '^homebrew_casks:' .goreleaser.yaml .goreleaser.yml; then
            if [ -z "$APP_CLIENT_ID" ] || [ -z "$TAP" ]; then
              echo "::error::.goreleaser.yaml publishes a Homebrew cask, which needs app-client-id + app-private-key (and a homebrew-tap) to mint the tap token"
              exit 1
            fi
            echo "cask=true" >> "$GITHUB_OUTPUT"
          fi

      # The default GITHUB_TOKEN cannot push to another repository, so mint a
      # short-lived installation token from the caller's App, scoped to the tap
      # repository alone: contents to push the cask branch, pull-requests to open
      # and (in the last step) merge its pull request. It expires within the hour
      # and is revoked when the job ends -- nothing long-lived to rotate or let
      # lapse.
      - name: Mint a homebrew tap token
        id: tap-token
        if: steps.homebrew.outputs.cask
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.homebrew-tap }}
          permission-contents: write
          permission-pull-requests: write

      # The release runs through the repo's `release` mise task (the go and
      # swift toolchain archetypes define it as `goreleaser release --clean`),
      # so a repo customises its release by overriding the task, not this
      # workflow. A draft release or a .goreleaser.yaml without the task is a
      # broken contract, so fail before anything is built -- leaving the draft
      # to retry -- rather than skip the release.
      - name: Detect the release task
        run: |
          if ! mise tasks ls --name-only | grep -qxF release; then
            echo "::error::the release is a draft or .goreleaser.yaml exists, but no 'release' mise task is defined -- include a toolchain archetype that provides it, or define one"
            exit 1
          fi

      # Every tool the task runs is mise-pinned (no goreleaser-action, no
      # floating `latest`). --draft is appended to the task's command; for
      # GoReleaser it overrides release.draft in the caller's config. Whatever
      # the tool, the task fills the draft and must not publish it: the release
      # stays a draft until the publish step at the end of this job. A task that
      # also pushes to a registry (npm, PyPI -- both immutable) does that last,
      # after everything else inside the task that can fail; it authenticates
      # with this job's OIDC token (id-token: write) via trusted publishing.
      - name: Create release (mise run release)
        run: mise run release --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the App's token scoped to the Homebrew tap (empty without a cask)
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          # Developer ID certificate + App Store Connect API key for a
          # .goreleaser.yaml `notarize.macos` block: goreleaser's embedded quill
          # signs and notarizes the darwin binaries in-process, on any runner,
          # Linux included (no macOS runner needed, no Pro licence; the mise pin is past the
          # v2.5 that introduced it). Empty values are harmless --
          # goreleaser's isEnvSet treats an empty variable as unset, and a config
          # without a notarize block never reads them. The two base64 values are
          # single-line so GitHub's secret masking covers them in the log.
          MACOS_SIGN_P12: ${{ secrets.macos-sign-p12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.macos-sign-password }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.macos-notary-issuer-id }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.macos-notary-key-id }}
          MACOS_NOTARY_KEY: ${{ secrets.macos-notary-key }}

      # Attest SLSA build provenance (the default mode when no predicate is given)
      # for every file listed in dist/checksums.txt (for GoReleaser: archives +
      # SBOMs + signature bundles). Any release task opts in by writing a
      # sha256sum-format dist/checksums.txt; one that writes none (a pure
      # registry publish) skips this. A .goreleaser.yaml always produces it, so
      # the step still runs there when the file is missing and fails loudly
      # rather than shipping unattested binaries. Verify with:
      #   gh attestation verify --owner <org> <file>
      - name: Attest release artifacts
        if: ${{ hashFiles('dist/checksums.txt') != '' || hashFiles('.goreleaser.yaml', '.goreleaser.yml') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      # Attest SLSA build provenance for every container image goreleaser
      # published: dist/digests.txt (the docker_digest artifact) lists
      # `<hex digest>  <image:tag>` in the same checksum format. Skipped on a
      # repo that builds no images -- gated on a repo-root Dockerfile like the
      # container setup steps above, because goreleaser writes an *empty*
      # digests.txt even when no images were built, which an existence check
      # alone (hashFiles hashes empty files too) would wave through into an
      # attest failure ("no statement subjects"). Verify with:
      #   gh attestation verify --owner <org> oci://ghcr.io/<org>/<image>:<tag>
      - name: Attest container images
        if: ${{ hashFiles('Dockerfile', 'Dockerfile.*') != '' && hashFiles('dist/digests.txt') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt

      # Publish the release last. Releases are immutable once published (assets
      # and tag frozen), so every step that can fail -- uploads, the cask push,
      # the attestations -- runs while it is still a draft; a failure above
      # leaves a draft that can be deleted and re-run rather than a
      # half-shipped release that can never be fixed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # Merge the cask only now that the release is public, so the tap never
      # points at draft assets that 404. The caller's homebrew_casks pushes to
      # the branch bot/<repo>-<tag> with pull_request enabled (bot/** is exempt
      # from the org's fork-only ruleset), so the pull request is found by that
      # head branch. Squash is the merge method the tap allows; it deletes the
      # merged branch itself. A caller that still pushes the cask straight to
      # main has no pull request here and gets a warning instead of a failure.
      - name: Merge homebrew cask pull request
        if: steps.homebrew.outputs.cask
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP: ${{ github.repository_owner }}/${{ inputs.homebrew-tap }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          branch="bot/${GITHUB_REPOSITORY#*/}-$TAG"
          pr="$(gh pr list --repo "$TAP" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "::warning::no open cask pull request from $branch in $TAP; set homebrew_casks.repository.branch to $branch with pull_request.enabled in .goreleaser.yaml"
            exit 0
          fi
          gh pr merge "$pr" --repo "$TAP" --squash

  # Build the Zensical documentation site and publish it to GitHub Pages -- the
  # zensical.toml counterpart to the publish path. It only needs release-please
  # (not publish), so on a repo that both ships binaries and publishes docs the
  # two run in parallel; on a docs-only repo publish is skipped and this runs
  # straight off release-please.
  #
  # By default it runs only when this run cut a release, and builds the release
  # tag. With always-publish-docs it also runs on every other trusted run on the
  # default branch, building the pushed commit (github.sha) -- the ref guard keeps
  # a workflow_dispatch from a feature branch from publishing unreleased docs. On a
  # run that does cut a release, the tag is still what gets built.
  #
  # The site is built by the repo's `docs-build` mise task (the toolchain's common
  # tasks define it as `uv sync` + `zensical build` into ./site), so a repo whose
  # docs embed generated, uncommitted content -- a demo render, chart references --
  # overrides the task to generate it first, and its tools come from the same
  # mise pins. The consuming repo must set Settings -> Pages -> Source -> GitHub
  # Actions for the deploy to land.
  #
  # Same trusted-trigger allowlist as publish: this checks out a computed ref and
  # runs the repo's locked deps, so it is gated to vetted events and fails closed on
  # any other (defense in depth for a reusable workflow that cannot see its caller's
  # trigger).
  docs:
    needs: release-please
    if: >-
      needs.release-please.outputs.zensical &&
      (needs.release-please.outputs.release_created ||
      (inputs.always-publish-docs && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # check out the source to build the site
      contents: read
      # publish the GitHub Pages deployment
      pages: write
      # OIDC token the deploy-pages action exchanges for the Pages deploy
      id-token: write
    # serialize Pages deployments; never cancel an in-flight publish (a newer
    # pending run replaces an older pending one, so pushes in quick succession
    # still converge on the latest commit)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository at release tag or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build the exact commit the release was tagged at; with no release
          # (always-publish-docs), the commit that triggered the run
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false # read-only checkout; don't leave the token in .git/config
          # pull Git LFS objects so Zensical embeds real assets, not pointer files; a
          # no-op on repos that track nothing in LFS.
          lfs: true
          submodules: true # fetch the shared task library (bitwise-media-group/make), mounted at .mise/, whose mise pins and tasks build the site; a no-op where the config is a root mise.toml

      # Everything docs-build needs from the repo's mise pins (sha256-verified
      # against mise.lock, `--locked` added automatically): the eager pins
      # install here, lazy ones such as uv on first use inside the task. Nothing
      # here is signed or attested, so the mise cache stays on.
      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # an exact version, and no sha256 input: the action then verifies the
          # download for the runner's platform against the release's Sigstore-signed
          # packslip (bound to mise's release workflow at this tag), a check a
          # sha256 input would replace with a bare hash comparison
          version: v2026.11.10

      # A zensical.toml without the task is a broken contract (every toolchain
      # include provides docs-build), so fail rather than publish nothing.
      - name: Detect the docs-build task
        run: |
          if ! mise tasks ls --name-only | grep -qxF docs-build; then
            echo "::error::zensical.toml exists but no 'docs-build' mise task is defined -- include the toolchain's common tasks or define one"
            exit 1
          fi

      # The repo's docs-build task renders the site into ./site (uv resolves the
      # locked deps and the Python toolchain on demand).
      - name: Build site (mise run docs-build)
        run: mise run docs-build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Move the floating major/minor tags (v1, v1.1) that consumers pin onto the new
  # release commit -- one implementation shared by both paths, ordered last. It
  # needs publish, so on the publish path the tags advance only after that job has
  # published and attested the release (never pointing @v1 at a half-finished
  # release); on every other path publish is skipped and this runs straight
  # after release-please. The release was already cut by release-please and dist/
  # freshness is enforced in CI, so there is nothing to build or verify -- a pure
  # tag move via the API, no checkout or toolchain.
  #
  # `!cancelled()` is required so a skipped publish (no build step) does not
  # skip this job by dependency; the result guard then proceeds only when publish
  # succeeded or was skipped, never when it failed -- so a failed release never
  # advances the tags. Same trusted-trigger allowlist as publish (fails closed on
  # any event type not vetted here).
  vanity-tags:
    needs: [release-please, publish]
    if: >-
      !cancelled() && inputs.vanity-tags && needs.release-please.outputs.release_created &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name)
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # move vanity tags
      contents: write
    steps:
      - name: Move vanity tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -eu
          MAJOR="${TAG%%.*}" # v1
          MINOR="${TAG%.*}"  # v1.1
          for ref in "$MAJOR" "$MINOR"; do
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$ref" -X PATCH -f sha="$SHA" -F force=true ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$ref" -f sha="$SHA"
          done
