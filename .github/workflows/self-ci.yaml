# This repo's own CI, dogfooding the reusable ci workflow by local path (so it
# always runs the current definition, not a release pin). The library has no root
# go.mod and no committed dist/ -- every tool comes from the shared toolchain
# submodule's pins at .mise/ -- so the reusable workflow sets up mise only and
# runs the canonical tasks: lint (prose + license + workflow lint) and build
# (the Zensical docs site, which also fails when a reusable workflow has no
# page) are defined here; test is not, so it is skipped.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: $/.github/workflows/ci.yaml
