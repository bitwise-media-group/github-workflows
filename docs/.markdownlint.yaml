# Docs-site rules for docs/ only. markdownlint-cli2 REPLACES (not merges) the
# rule config for a directory that carries its own .markdownlint.yaml, so the
# house rules from the root .markdownlint-cli2.yaml are repeated here, with one
# change: pymdownx admonition and tab bodies (`!!! note`, `=== "go"`) need a
# 4-space indent that a CommonMark parser reads as an indented code block, so
# the house "fenced only" code-block style can't apply. Zensical renders them
# natively.
default: true
line-length:
  line_length: 120
  tables: false
no-duplicate-heading:
  siblings_only: true
code-block-style: false
