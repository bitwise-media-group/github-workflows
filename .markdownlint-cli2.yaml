# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/refs/heads/main/schema/markdownlint-cli2-config-schema.json
config:
  default: true
  # keep prose readable in terminals and diffs; tables are exempt.
  line-length:
    line_length: 120
    tables: false
  no-duplicate-heading:
    siblings_only: true
  code-block-style:
    style: fenced

globs:
  - "**/*.md"

ignores:
  - ".mise/**"
  # agent cruft
  - ".claude/**"
  # machine-written by release-please, not house prose
  - "CHANGELOG.md"
  # uv-managed virtualenv (site-packages ship their own markdown)
  - ".venv/**"
  # docs site build output and the workflow reference fragments generated into
  # build/workflow-docs/ (machine-written tables, not house prose)
  - "site/**"
  - "build/**"
