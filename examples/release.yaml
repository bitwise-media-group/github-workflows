# Caller workflow -- copy to `.github/workflows/release.yaml` in any repo. It owns
# the push trigger and grants the release permissions; the reusable release
# workflow runs release-please (two-pass) then, when a .goreleaser.yaml exists,
# GoReleaser (archives, checksums, SBOMs, cosign signatures, Developer ID-signed
# + notarized macOS binaries when the macos-* secrets are passed, optional
# Homebrew cask, SLSA attestation), and when a zensical.toml exists, rebuilds the docs site
# and publishes it to GitHub Pages. With vanity-tags: true it moves the floating
# v1 / v1.1 tags that consumers pin. A committed dist/ is verified in CI, not at
# release.
#
# The repo must provide release-please-config.json + .release-please-manifest.json.
# Go repos add a .goreleaser.yaml (release-type: go, draft: true); Actions repos
# that commit dist/ set vanity-tags: true; repos that publish docs add a
# zensical.toml (+ pyproject.toml + uv.lock) and enable Pages from GitHub Actions.
#
# Replace the all-zeros placeholder SHA with the full commit SHA of the release you want
# (the # comment names it; Renovate keeps both current) -- see README "Pinning".

name: Release

on:
  push:
    branches: [main]

# Ceiling for the reusable workflow's release-please + goreleaser/publish/docs jobs.
# GitHub resolves a reusable workflow's permissions as the union of every job and
# ignores `if:`, so grant every scope below even when a job is skipped (no
# .goreleaser.yaml, no zensical.toml) -- a missing scope startup-fails the whole run.
permissions:
  # create the release/tag, move vanity tags, and upload assets
  contents: write
  # release-please creates pr labels via the issues api
  issues: write
  # release-please opens the release pull request
  pull-requests: write
  # cosign keyless signing (goreleaser) + the docs job's Pages OIDC deploy
  id-token: write
  # github build-provenance attestation
  attestations: write
  # artifact storage record for the attestation
  artifact-metadata: write
  # push container images to ghcr (goreleaser dockers_v2, when configured)
  packages: write
  # publish the docs site to GitHub Pages (docs job, when a zensical.toml exists)
  pages: write

jobs:
  release:
    uses: bitwise-media-group/github-workflows/.github/workflows/release.yaml@0000000000000000000000000000000000000000 # v7.0.0 # x-release-please-version
    with:
      # move the floating v1 / v1.1 tags -- set for Actions/reusable repos whose
      # consumers pin @v1; drop (defaults false) for Go binaries pinned to exact versions.
      vanity-tags: true
      # optional -- author the release PR as a GitHub App instead of GITHUB_TOKEN.
      # Set this only if you auto-merge release PRs via the reusable merge workflow:
      # a release PR pushed by GITHUB_TOKEN does not emit workflow_run events, so the
      # auto-merge never retriggers when its checks go green. Reuse the "FF Merge" App.
      # app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
    secrets:
      # optional -- only needed if .goreleaser.yaml pushes a Homebrew cask to another repo
      homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # optional -- required only when app-client-id is set above
      # app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
      # optional -- Apple signing + notarization of the darwin binaries, for a
      # .goreleaser.yaml with a notarize.macos block. Org secrets (the shared
      # open-source Developer ID certificate + the team notary key), scoped to
      # the notarizing repos -- see README "macOS notarization: org setup".
      # macos-sign-p12: ${{ secrets.MACOS_SIGN_P12 }}
      # macos-sign-password: ${{ secrets.MACOS_SIGN_PASSWORD }}
      # macos-notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # macos-notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      # macos-notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
