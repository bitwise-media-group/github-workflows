# Caller workflow -- copy to `.github/workflows/update-tools.yaml` in any repo
# whose mise tools float on fuzzy selectors ("latest", "lts") and are locked in
# a root mise.lock. It owns the schedule/dispatch triggers and grants the update
# permissions; the reusable workflow runs `mise lock --bump` under the release
# cooldown and opens a single `fix(deps):` PR with the version changes.
#
# Pin @v6 to a release tag or full commit SHA -- see README "Pinning".

name: Update Tools

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      cooldown-days:
        description: Minimum age (days) a release must have before it is adopted.
        required: false
        default: "7"

# one updater at a time; a fresh run supersedes a stale one
concurrency:
  group: update-tools
  cancel-in-progress: true

# ceiling for the reusable workflow's update job
permissions:
  # push the update branch
  contents: write
  # open/update the pull request
  pull-requests: write

jobs:
  update:
    uses: bitwise-media-group/github-workflows/.github/workflows/update-tools.yaml@v6
    with:
      cooldown-days: ${{ github.event.inputs.cooldown-days || '7' }}
      # app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }} # App-authenticated push, so the PR's CI runs
    # secrets:
    #   app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
